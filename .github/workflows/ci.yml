name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Fetch the official FatturaPA schema
        run: npm run xsd:fetch
      - name: Unit tests (including XSD validation)
        run: npm test
        env:
          REQUIRE_FATTURAPA_XSD: '1'
      - name: Build
        run: npx vite build
